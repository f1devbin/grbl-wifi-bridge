<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;color:#fff;font-family:system-ui,"Segoe UI",Roboto,Ubuntu,sans-serif;
background:radial-gradient(900px 500px at 0% 0%,rgba(255,212,0,.22),transparent 60%),
radial-gradient(800px 500px at 100% 100%,rgba(92,200,255,.18),transparent 60%),#0a0d12}
.box{position:absolute;inset:56px 64px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:22px}
.mark{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;
background:linear-gradient(135deg,#ffd400,#ffb800);box-shadow:0 16px 40px rgba(255,200,0,.45)}
.mark svg{width:58px;height:58px;fill:none;stroke:#111;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.name{font-size:46px;font-weight:900;letter-spacing:.3px}
h1{font-size:74px;line-height:1.05;margin:0;font-weight:900;letter-spacing:-1px}
h1 em{font-style:normal;color:#ffd400}
p{font-size:32px;margin:18px 0 0;font-weight:600}
.chips{display:flex;gap:14px;flex-wrap:wrap}
.chip{padding:10px 22px;border-radius:999px;font-size:26px;font-weight:800;border:2px solid #33404f;background:#151b23}
.chip.y{border-color:#ffd400;color:#ffd400}
</style></head><body><div class="box">
<div class="top"><div class="mark"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
<div class="name">GRBL Wi-Fi Bridge</div></div>
<div><h1>GRBL laser engravers and CNC<br>over <em>Wi-Fi</em></h1>
<p>ESP32-S3 USB host · LightBurn · Universal Gcode Sender</p></div>
<div class="chips"><span class="chip y">Flash in your browser</span><span class="chip">Web panel</span><span class="chip">Emergency stop</span><span class="chip">Open source</span></div>
</div></body></html>
