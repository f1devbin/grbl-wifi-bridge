name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'dependencies.lock') }}

      - name: Install tools
        run: pip install platformio "esptool>=5"

      - name: Build firmware
        run: pio run

      - name: Package images
        run: |
          set -euo pipefail
          B=.pio/build/esp32s3
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p out
          esptool --chip esp32s3 merge-bin -o "out/grbl-wifi-bridge-esp32s3-v${VER}-factory.bin" \
            --flash-size 8MB \
            0x0 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0xf000 "$B/ota_data_initial.bin" \
            0x20000 "$B/firmware.bin"
          cp "$B/firmware.bin" "out/grbl-wifi-bridge-esp32s3-v${VER}-ota.bin"
          ls -l out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cat > NOTES.md <<'EOF'
          Wireless GRBL for laser engravers and CNC machines: an ESP32-S3 USB host bridge that exposes a GRBL controller over Wi-Fi to LightBurn, UGS or any TCP sender.

          Two images are attached:

          - `-factory.bin` — full image for the [browser flasher](https://f1devbin.github.io/grbl-wifi-bridge/) (offset 0x0, erases the board).
          - `-ota.bin` — upload it in the web panel under Firmware, or POST it to `/api/update`.

          Requires an ESP32-S3 board with native USB OTG and at least 8 MB of flash. Read the [README](https://github.com/f1devbin/grbl-wifi-bridge#readme) before connecting a machine, and never leave a running laser unattended.
          EOF
          gh release create "$GITHUB_REF_NAME" out/*.bin \
            --verify-tag \
            --generate-notes \
            --title "GRBL Wi-Fi Bridge ${VER}" \
            --notes-file NOTES.md
