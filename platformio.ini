; GRBL Wi-Fi Bridge for ESP32-S3 boards with native USB OTG and at least 8 MB flash.
; Build output goes to .pio/ (git- and Syncthing-ignored).
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = platformio/espressif32 @ 7.1.3
platform_packages = platformio/framework-espidf @ 4.60100.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.embed_txtfiles = src/web/index.html
monitor_speed = 115200
